packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
injectWorkspacePackages: true
# React Flow's d3 ranges would otherwise pick the 2026-11-03 patch releases (under 14 days old).
# Drop these once those releases are 14+ days old and reviewed.
overrides:
  d3-color: 3.1.0
  d3-dispatch: 3.0.1
  d3-drag: 3.0.0
  d3-ease: 3.0.1
  d3-interpolate: 3.0.1
  d3-selection: 3.0.0
  d3-timer: 3.0.1
  d3-transition: 3.0.1
  d3-zoom: 3.0.0

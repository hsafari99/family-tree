name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: docker compose up -d --wait postgres s3
      - run: pnpm test:int
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/api/Dockerfile -t family-tree-api:ci .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Made up; the Google spec checks the authorization URL carries exactly this ID.
      E2E_GOOGLE_CLIENT_ID: ci-fake-client-id.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @family-tree/e2e exec playwright install --with-deps --only-shell chromium
      # The dev stack in Docker, with Better Auth's limits off for E2E only (decision 15).
      - run: docker compose up -d --build --wait postgres s3
      # A made-up Google client, so the Google E2E test runs against the stubbed Google page.
      # Never a real client: nothing in CI talks to Google.
      - name: Fake Google OAuth client for E2E
        run: printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\n' "$FAKE_GOOGLE_CLIENT_ID" "$FAKE_GOOGLE_CLIENT_SECRET" > .env.development.local
        env:
          FAKE_GOOGLE_CLIENT_ID: ${{ env.E2E_GOOGLE_CLIENT_ID }}
          FAKE_GOOGLE_CLIENT_SECRET: ci-fake-google-secret-not-real
      - run: docker compose up -d --build api web
        env:
          AUTH_RATE_LIMIT_ENABLED: 'false'
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - if: always()
        run: docker compose logs --tail 200 api; docker compose down -v
